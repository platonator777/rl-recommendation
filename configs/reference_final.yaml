final:
  selection_id: reference_final_validation_frozen_20261014
  selection_split: validation
  selected_family: GRPO_Q1_H1_beta1_centered_corrected_reuse1
  selection_rule: Freeze the previously selected H=1 Q1 beta=1 centered-corrected,
    reuse=1 candidates by rollout seed using validation-only ranking and stated point/CI
    guardrails. Freeze SFT, matched same-walltime CE, Q2-seconds screen and H=5 checkpoints
    as comparison/diagnostic candidates. No Test metric or policy score from RM_audit
    is used for selection.
  selection_rationale: The primary comparison is incremental RL gain from the weak
    and strong seed17 SFT starts under the qualified Q1 RM_reference fit, with rollout seeds
    17/42/73. Exactly one strong SFT 2M-target × 10-additional-pass recipe was trained
    on seed17 per user direction; no strong SFT training runs on seeds42/73 were performed.
    Those seeds are rollout randomness only and reuse the frozen seed17 actors. The
    candidate set also preserves same-walltime CE, Q2 and H=5 diagnostics, including
    guardrail failures, for transparent comparison. The existing Test split was previously
    opened, so any final Test result is a post_test_research_iteration and is not
    a fresh holdout.
  test_status: post_test_research_iteration
  model_config: configs/reference_rl.yaml
  output: artifacts/reference/final_test_evaluation_reference.json
  test_protocol:
    anchors_per_user: 10
    anchor_seed: 17
    batch_size: 16
    top_k: 10
    bootstrap_seed: 17
